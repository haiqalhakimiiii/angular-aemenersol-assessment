<app-topbar></app-topbar>

<div class="px-5 py-6 max-w-6xl mx-auto">
  <div class="text-xl font-semibold text-gray-800 mb-6">
    Overview
  </div>
  <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg">
    {{ errorMessage }}
  </div>

  <div *ngIf="isLoading" class="flex justify-center items-center min-h-96">
    <div class="text-center">
      <div class="inline-block">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
      </div>
      <p class="mt-4 text-gray-600">Loading dashboard data...</p>
    </div>
  </div>

  <div *ngIf="!isLoading" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
    <div class="bg-white rounded-lg shadow-md pb-6">
      <h2 class="text-lg p-2 font-semibold text-gray-800 mb-4 mt-0 bg-gray-200">Card Title</h2>
      <canvas #donutChartCanvas></canvas>
    </div>
    <div class="bg-white rounded-lg shadow-md pb-6">
      <h2 class="text-lg p-2 font-semibold text-gray-800 mb-4 mt-0 bg-gray-200">Card Title</h2>
      <canvas #barChartCanvas></canvas>
    </div>
  </div>

  <div *ngIf="!isLoading" class="bg-white p-6 rounded-lg shadow-md overflow-x-auto">
    <h2 class="text-lg font-semibold text-gray-800 mb-4 mt-0">Users List</h2>
    <table class="w-full border-collapse">
      <thead>
        <tr class="bg-gray-100">
          <th class="px-4 py-3 text-left font-semibold text-gray-800 border border-gray-300">#</th>
          <th class="px-4 py-3 text-left font-semibold text-gray-800 border border-gray-300">First Name</th>
          <th class="px-4 py-3 text-left font-semibold text-gray-800 border border-gray-300">Last Name</th>
          <th class="px-4 py-3 text-left font-semibold text-gray-800 border border-gray-300">User Name</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of tableUsers; let i = index" class="hover:bg-gray-50 transition-colors">
          <td class="px-4 py-3 text-gray-600 border border-gray-200">{{ i + 1 }}</td>
          <td class="px-4 py-3 text-gray-600 border border-gray-200">{{ user.firstName }}</td>
          <td class="px-4 py-3 text-gray-600 border border-gray-200">{{ user.lastName }}</td>
          <td class="px-4 py-3 text-gray-600 border border-gray-200">{{ user.username }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
