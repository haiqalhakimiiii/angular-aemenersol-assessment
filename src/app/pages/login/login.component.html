<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="border border-black">
      <div class="bg-[#f7f7f7] text-center p-2">
        <p class="font-semibold mt-2">Sign in to your dashboard</p>
      </div>
      <div class="bg-white rounded-lg shadow-lg p-8">

        <div *ngIf="errorMessage" class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg">
          {{ errorMessage }}
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <div>
            <input type="text" id="username" formControlName="username"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
              placeholder="Username" [disabled]="isLoading" />
            <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
              class="mt-1 text-sm text-red-600">
              <p *ngIf="loginForm.get('username')?.errors?.['required']">Username is required</p>
            </div>
          </div>

          <div>
            <input type="password" id="password" formControlName="password"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
              placeholder="Password" [disabled]="isLoading" />
            <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
              class="mt-1 text-sm text-red-600">
              <p *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</p>
              <p *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters</p>
            </div>
          </div>

          <button type="submit" [disabled]="isLoading || loginForm.invalid"
            class="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:cursor-not-allowed">
            {{ isLoading ? 'Signing in...' : 'SIGN IN' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
